name: UI Improvement
description: Suggest ideas to make the Action Regulator UI more user-friendly.
title: "[UI]: "
labels:
  - enhancement
  - ui
assignees: []
body:
  - type: markdown
    attributes:
      value: I want to make the UI as usable as possible while still having a high degree of customizability, so if you have any ideas how it could be better, please submit them!

  - type: textarea
    id: current_ui
    attributes:
      label: Which part of the UI needs improvement?
      description: Describe the specific menu, screen, or button that feels clunky, confusing, or hard to use.
      placeholder: "In the rule creation menu..."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: How could it be better?
      description: Explain your idea. You can also drag and drop screenshots or rough mockups directly into this text box to illustrate your point!
      placeholder: "It would be much faster if these options were checkboxes instead of a dropdown..."
    validations:
      required: true